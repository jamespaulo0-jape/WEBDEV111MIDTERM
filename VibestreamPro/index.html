<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VibeStream Pro</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

/* LOGIN */
#loginPage {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.login-box {
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
}
input {
    width: 90%;
    padding: 10px;
    margin: 10px;
    border-radius: 8px;
    border: none;
}
button {
    padding: 10px;
    width: 95%;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    cursor: pointer;
}

/* APP */
#app {
    display: none;
}

header {
    padding: 15px;
    background: #020617;
    text-align: center;
    font-size: 20px;
}

.playlist {
    padding: 20px;
}
.song {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    background: #1e293b;
    margin: 10px 0;
    border-radius: 10px;
    cursor: pointer;
}
.song:hover {
    background: #334155;
}

.player {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #020617;
    padding: 10px;
    text-align: center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h2>🎧 VibeStream Pro</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- APP -->
<div id="app">
    <header>VibeStream Pro</header>

    <div class="playlist" id="playlist"></div>

    <div class="player">
        <p id="nowPlaying">No song playing</p>
        <button onclick="prevSong()">⏮</button>
        <button onclick="togglePlay()">▶ / ⏸</button>
        <button onclick="nextSong()">⏭</button>
        <audio id="audio"></audio>
    </div>
</div>

<script>
// LOGIN SYSTEM (accept anything)
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user && pass){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "block";
    } else {
        alert("Enter username & password");
    }
}

// PLAYLIST (replace paths if needed)
const songs = [
    {title: "Imahe", file: "PlayList/Imahe.mp3"},
    {title: "Tahanan", file: "PlayList/Tahanan.mp3"},
    {title: "Ikaw at Ako", file: "PlayList/ikaw at ako.mp3"},
    {title: "Kalapastangan", file: "PlayList/Kalapastangan.mp3"},
    {title: "Kung Siya Man", file: "PlayList/Kung Siya Man.mp3"}
];

let currentIndex = 0;
const audio = document.getElementById("audio");

// LOAD PLAYLIST
const playlistDiv = document.getElementById("playlist");
songs.forEach((song, index) => {
    let div = document.createElement("div");
    div.className = "song";
    div.innerHTML = `<span>${song.title}</span><span>▶</span>`;
    div.onclick = () => playSong(index);
    playlistDiv.appendChild(div);
});

// PLAY SONG
function playSong(index){
    currentIndex = index;
    audio.src = songs[index].file;
    audio.play();
    document.getElementById("nowPlaying").innerText = "Now Playing: " + songs[index].title;
}

// PLAY/PAUSE
function togglePlay(){
    if(audio.paused){
        audio.play();
    } else {
        audio.pause();
    }
}

// NEXT / PREV
function nextSong(){
    currentIndex = (currentIndex + 1) % songs.length;
    playSong(currentIndex);
}

function prevSong(){
    currentIndex = (currentIndex - 1 + songs.length) % songs.length;
    playSong(currentIndex);
}
</script>

</body>
</html>
