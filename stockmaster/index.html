<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger App</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#07056b;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.container{
    background:white;
    padding:20px;
    border-radius:10px;
    width:100%;
    max-width:500px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

input, select, button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

table{
    width:100%;
    margin-top:15px;
    border-collapse:collapse;
}

th, td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
    font-size:14px;
}

th{
    background:#007bff;
    color:white;
}

.income{ color:blue; }
.expense{ color:red; }

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:5px 8px;
    cursor:pointer;
}

.delete-btn:hover{
    background:darkred;
}
</style>
</head>

<body>

<div class="container">
<h2>Ledger</h2>

<input type="text" id="desc" placeholder="Description">

<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<input type="number" id="amount" placeholder="Amount">

<button onclick="addTransaction()">Add Transaction</button>

<table>
<thead>
<tr>
<th>Description</th>
<th>Type</th>
<th>Amount</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>
<tbody id="ledgerTable"></tbody>
</table>

<h3>Total Balance: ₱<span id="balance">0.00</span></h3>
</div>

<script>
let transactions = JSON.parse(localStorage.getItem("ledger")) || [];

function saveData(){
    localStorage.setItem("ledger", JSON.stringify(transactions));
}

function render(){
    let table = document.getElementById("ledgerTable");
    table.innerHTML = "";

    let balance = 0;

    transactions.forEach((t, index)=>{
        let row = table.insertRow();

        row.insertCell(0).innerText = t.desc;
        row.insertCell(1).innerText = t.type;

        let amountCell = row.insertCell(2);
        amountCell.innerText = "₱" + t.amount.toFixed(2);
        amountCell.classList.add(t.type);

        row.insertCell(3).innerText = t.date;

        let actionCell = row.insertCell(4);
        actionCell.innerHTML = `<button class="delete-btn" onclick="deleteTransaction(${index})">X</button>`;

        if(t.type === "income") balance += t.amount;
        else balance -= t.amount;
    });

    document.getElementById("balance").innerText = balance.toFixed(2);
}

function addTransaction(){
    let desc = document.getElementById("desc").value;
    let type = document.getElementById("type").value;
    let amount = parseFloat(document.getElementById("amount").value);

    if(desc === "" || isNaN(amount) || amount <= 0){
        alert("Please enter valid data");
        return;
    }

    let transaction = {
        desc: desc,
        type: type,
        amount: amount,
        date: new Date().toLocaleDateString()
    };

    transactions.push(transaction);
    saveData();
    render();

    document.getElementById("desc").value = "";
    document.getElementById("amount").value = "";
}

function deleteTransaction(index){
    transactions.splice(index,1);
    saveData();
    render();
}

render();
</script>

</body>
</html>
