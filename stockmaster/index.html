<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockMaster</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f9;
}

header {
    background: #333;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.hidden { display: none; }

input, button {
    padding: 10px;
    margin: 8px 0;
    width: 100%;
}

button {
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #555;
}

.error { color: red; }

.nav {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.table {
    width: 100%;
    border-collapse: collapse;
}

.table th, .table td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

.table th {
    background: #333;
    color: white;
}
</style>
</head>

<body>

<header>
<h1>StockMaster Inventory System</h1>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="box">
<h2>Login</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<p class="error" id="errorMsg"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<div class="nav">
<h2 id="welcome"></h2>
<button onclick="logout()">Logout</button>
</div>

<div class="box">
<h3>Add Product</h3>
<input type="text" id="productName" placeholder="Product Name">
<input type="number" id="productQty" placeholder="Quantity">
<button onclick="addProduct()">Add Product</button>
</div>

<div class="box" style="margin-top:20px;">
<h3>Inventory</h3>
<table class="table">
<thead>
<tr>
<th>Name</th>
<th>Quantity</th>
<th>Action</th>
</tr>
</thead>
<tbody id="productList"></tbody>
</table>
</div>

</div>

</div>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];

function login() {
    const user = username.value;
    const pass = password.value;

    if (!user || !pass) {
        errorMsg.innerText = "Please fill all fields";
        return;
    }

    if (user === "admin" && pass === "1234") {
        localStorage.setItem("user", user);
        showDashboard(user);
    } else {
        errorMsg.innerText = "Invalid credentials";
    }
}

function showDashboard(user) {
    loginPage.classList.add("hidden");
    dashboard.classList.remove("hidden");
    welcome.innerText = "Welcome, " + user;
    renderProducts();
}

function logout() {
    localStorage.removeItem("user");
    dashboard.classList.add("hidden");
    loginPage.classList.remove("hidden");
}

function addProduct() {
    const name = productName.value;
    const qty = productQty.value;

    if (!name || !qty) {
        alert("Fill all fields");
        return;
    }

    products.push({ name, qty });
    localStorage.setItem("products", JSON.stringify(products));

    productName.value = "";
    productQty.value = "";

    renderProducts();
}

function renderProducts() {
    productList.innerHTML = "";

    products.forEach((p, index) => {
        productList.innerHTML += `
        <tr>
            <td>${p.name}</td>
            <td>${p.qty}</td>
            <td><button onclick="deleteProduct(${index})">Delete</button></td>
        </tr>`;
    });
}

function deleteProduct(index) {
    products.splice(index, 1);
    localStorage.setItem("products", JSON.stringify(products));
    renderProducts();
}

// Auto login
window.onload = () => {
    const user = localStorage.getItem("user");
    if (user) showDashboard(user);
};

// Clear error on typing
username.oninput = password.oninput = () => errorMsg.innerText = "";

// Enter key login
document.addEventListener("keydown", e => {
    if (e.key === "Enter") login();
});
</script>

</body>
</html>
